workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build Android debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
